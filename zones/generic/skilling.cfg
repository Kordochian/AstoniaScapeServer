# =====================================================================
# skilling.cfg - Mining, Smithing, Woodcutting and Crafting (Astonia rebuild)
# =====================================================================
#
# Every block is   KEY:  setting=value ...  ;     (# starts a comment)
# Items are templates from zones/generic/skilling.itm (or any other .itm).
#
# type=resource   something that stacks in the inventory (ore, bars, logs,
#                 arrows ...)   id=  item=
#                 stack_sprites=A,B,C,D  (optional) sprites for a stack of
#                 1, 2-9, 10-99 and 100+; missing or 0 uses the next smaller
#                 one, then the item's own sprite
#
# Gathering spots on the map (rock, tree, plant):
#     id=  item=  ore=RESOURCE (what it gives)  level=  xp= (per item)
#     ores= (items before it is empty)  respawn= (seconds until it refills)
#     empty_sprite= (sprite while empty)  chance= (base chance per try,
#     default 35)  skill=KEY|none  tool=pickaxe|axe|knife|hammer|none
# type=rock       default skill=MINING tool=pickaxe
# type=tree       default skill=WOODCUTTING tool=axe
# type=plant      default skill=FARMING tool=hoe (picked by hand)
#
# Tools: id=  item=  level= (skill level to use it)  power= (1 = basic,
#        each point is +10% chance per try)
# type=pickaxe  type=axe  type=hammer  type=knife
#
# Stations (the commands work within 3 tiles):
# type=furnace    /smelt          type=anvil      /smith
# type=bench      /craft (workbench)
# type=supply     id=  item=  give=TOOL ... give=RESOURCE,count ...
#                 (click it to get the listed tools you do not carry yet,
#                 and resources up to count)
#
# Recipes: make=RESOURCE or item template  need=RESOURCE,count (up to 4)
#     level=  xp= (per make)  amount= (how many of the resource one make
#     gives, default 1)  fail= (percent chance to lose the materials at that
#     level, 2 less per level above)  name= description= (of the made item,
#     default: template's)  skill=KEY  tool=...|none  group=RESOURCE (tab in
#     the client window, default: the first need=)
# type=smelt      at a furnace, default skill=SMITHING tool=none
# type=smith      at an anvil, default skill=SMITHING tool=hammer
# type=craft      at a workbench, default skill=CRAFTING tool=knife
#
# id= is saved with the items players carry: NEVER change or reuse an id
# once players have the items. Ids must be unique over all blocks with item=.
# Recipes have no id, add or change them any time.
#
# Chance per try at a rock or tree: chance (35%) + 2% per level above the
# spot's level + 10% per tool power above 1 + Bless + Body Control, from 5%
# to 95%.
#
# Players: click a rock, tree or plant (repeats until it is empty or the
# inventory is full). Click a stack in the inventory with an empty hand to
# split it, with the same thing in hand to join stacks. At a station type
# /smelt, /smith or /craft to see the recipes, "/smelt bronze bar 10",
# "/smith bronze dagger all", "/craft arrow shafts 5", or click the station
# holding a material. Clients with protocol 6+ get a window instead (the
# workbench window needs protocol 9).

# Bless (the spell) does not change combat stats any more. While blessed,
# a character gets bless_gather percent added to the chance per try at
# rocks, trees and plants, and bless_craft percent taken off the fail chance
# of recipes that have fail=. bless_gather_strength / bless_craft_strength
# add that percent of the spell's strength on top (0 = flat bonus only).
# The strength is the caster's Magic level, so with 10 a Bless cast at Magic
# 10 gives +1% more, at Magic 60 +6%, at Magic 99 about +10%.
#
# Combat (RuneScape-style hits, step 14; all percent):
# Effective melee levels (step 18): accuracy = Attack, strength = Strength,
#   defence = Defence. Enemies use V_ATTACK, V_STR and V_PARRY from their
#   .chr files the same way.
# tactics_boost: this percent of Tactics is added to the effective melee
#   levels. Players have no Tactics any more; only enemies with V_TACTICS
#   are affected (0 = off).
# min_hit: a melee hit that lands rolls between this percent of the max hit
#   and the max hit, so a hit always does something.
# armor_soak: armor takes off at most this percent of a melee hit.
# magic_damage_cap: the most Magic Damage % gear can add to Fire/Lightning.
# Gear no longer changes skills; weapons and armour carry Melee Accuracy,
# Melee Strength, Melee Defence, Magic Accuracy, Magic Damage and Magic
# Defence (mod_index=V_MELEE_ACC ... in the .itm files).
#
# Body Control and Clarity were removed as player skills in step 18; the
# settings below stay for enemies that are given them.
# (step 15; gear cannot raise them; all in TENTHS
# of a percent per skill level, so 3 = 0.3% per level, 30% at level 99):
# body_control: raises the effective melee levels (accuracy, strength,
#   defence, surround) after Tactics.
# body_control_gather: added to the chance per try at rocks, trees and
#   plants (2 = +0.2% per level, about +20% at level 99).
# clarity: raises Fire/Lightning/Freeze strength, Fire/Lightning damage and
#   your Immunity against spells.
# clarity_luck: chance per resource gathered of one extra (2 = 0.2% per
#   level, about 20% at level 99). The extra gives no XP and does not use
#   up the rock or tree.
# armor_class_percent: each Defence level (it is also the armour
#   requirement, called Armor Class before step 18) raises the Armor, Melee
#   Defence and Magic Defence of the armour you wear (items that need Armor
#   Class) by this many tenths of a percent (5 = 0.5% per level, +49.5% at
#   99). Negative values (the Magic Defence penalty on melee armour) are not
#   changed.
# weapon_skill_percent: the same for the weapon you wield: each Attack level
#   (players' weapon skills all follow Attack since step 18) raises its
#   Melee Accuracy, Melee Strength, Magic Accuracy and Magic Damage by this
#   many tenths of a percent.
# Both are worked out on you, never stored on the item: gear you trade away
# keeps only its own values, and better gear always stays better for the
# same player.
#
# Stealth and Perception (step 16; the old Stealth/Perception escape roll is
# gone, anyone can walk away from a fight):
# perception_stealth: Perception is this percent higher while the one
#   looking is in stealth mode (careful), perception_fast: this percent lower
#   in fast mode (careless). Normal mode uses Perception as it is.
# stealth_endurance: a step in stealth mode costs this percent of a fast
#   step's endurance (players). Players get no endurance back while in
#   stealth mode, and drop to normal mode when exhausted. 0 = sneaking free.
#
# Skills, one job each (step 18). Players have no attributes; Strength is a
# skill (melee max hit). The old attribute settings only matter for enemies
# that still have Agility / Intuition / Wisdom in their .chr files (0 = off):
# agility_bonus: to the melee accuracy and defence levels.
# agility_speed: to Speed (movement and action speed).
# intuition_bonus: to the spell power of every spell.
# wisdom_bonus: to mana regeneration and to Immunity against spells.
# athletics_speed: this percent of Athletics is added to Speed (movement
#   and attack speed; 50 = +49 Speed at Athletics 99).
# immunity_defence: resistance to spells is at least this percent of your
#   Defence (enemies: or their Immunity value, whichever is higher).
#
# Magic XP per spell cast (only casts that work; the Mana feed of skills.cfg
# applies as usual): spell_xp_heal, spell_xp_bless, spell_xp_freeze,
# spell_xp_magicshield give this much XP every cast. spell_xp_fire and
# spell_xp_lightning are 0, so Fire and Lightning only give XP for the
# damage they do to an enemy (dmg_xp of MAGIC in skills.cfg, per hitpoint).
#
# Walking XP per step (players): walk_xp is the base, the others are the
# percent of it each skill gets. Fast mode: fast_athletics to Athletics and
# fast_perception to Perception. Stealth mode: stealth_stealth to Stealth and
# stealth_athletics to Athletics. Normal mode gives none. Fractions are given
# by chance (half a point = one point every second step on average).
# stealth_combat_pause: no Stealth XP for steps within this many seconds of a
# melee attack you made or took, so fighting in stealth mode does not train
# Stealth.
config:
bless_gather=10
bless_craft=10
bless_gather_strength=10
bless_craft_strength=10
tactics_boost=0
min_hit=20
armor_soak=75
magic_damage_cap=50
body_control=3
body_control_gather=2
clarity=3
clarity_luck=2
armor_class_percent=5
weapon_skill_percent=5
perception_stealth=25
perception_fast=25
stealth_endurance=100
agility_bonus=0
agility_speed=0
intuition_bonus=0
wisdom_bonus=0
athletics_speed=50
immunity_defence=50
spell_xp_heal=8
spell_xp_bless=8
spell_xp_freeze=8
spell_xp_magicshield=8
spell_xp_fire=0
spell_xp_lightning=0
walk_xp=2
fast_athletics=50
fast_perception=50
stealth_stealth=100
stealth_athletics=25
stealth_combat_pause=5
;

