# so use_xp is not used for spells. Fire and Lightning train Magic by damage.
use_xp=0
dmg_xp=4
feed=MANA,25
description="The power of every spell: Fire, Lightning, Freeze, Heal, Bless and Magic Shield. Trained by casting."
;

# ---- support ----
REGENERATE:
