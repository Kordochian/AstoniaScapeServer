# =====================================================================
# skills.cfg - the skill registry (Astonia rebuild, use-based skills)
# =====================================================================
#
# Every skill in the game is a block here. Skills level 1..max by use.
# George 2026-10-13 (step 18): one short RuneScape-style list. Attack,
# Strength, Defence, Magic, Hitpoints, Mana, Endurance, Athletics,
# Regenerate, Stealth, Perception, Warcry, Woodcutting, Crafting, Mining,
# Smithing, Farming, Slayer. No attributes: each skill does one job.
#
#   KEY:            block name; .chr files set it with SK_KEY=level
#   id=             save index (0..126; 127 holds the combat style). NEVER change or reuse an id once
#                   players exist, their XP is stored by id.
#   name=           shown to players
#   group=          power, attribute, combat, magic, gathering, production, support
#   value=          V_* slot the level is copied into (combat maths use it).
#                   Leave out for skills that only exist here (Mining ...).
#   mirror=V_X      the same level is also copied into this slot (up to 8),
#                   e.g. Attack -> every weapon skill, Magic -> every spell.
#                   XP the code gives to a mirrored slot goes to this skill.
#   start=          level every player starts with (0 = does not start with it)
#   max=            highest level (default 99)
#   rate=           XP multiplier for this skill in percent (default 100)
#   use_xp=         XP per use (spell cast, warcry, parry, ...)
#   dmg_xp=         XP per hitpoint of damage done with this skill
#   feed=KEY,pct    also give pct percent of every XP gain to skill KEY
#                   (up to 8 per skill; feeds do not chain)
#   description=    help text
#
# Where XP comes from in the code (search for skill_used / skill_xp_context):
#   melee hit -> by the player's combat style (/style or the client's style
#   panel): ATTACK, STRENGTH or DEFENCE dmg_xp, Shared = a third to each (all
#   feed Hitpoints, Endurance, Athletics), an attack on you misses -> DEFENCE
#   use_xp,
#   spell cast -> spell_xp_* in skilling.cfg, Fire/Lightning damage -> MAGIC
#   dmg_xp, warcry -> WARCRY, walking in fast/stealth mode -> walk_xp in
#   skilling.cfg (Athletics, Perception, Stealth),
#   spotting a character in stealth mode -> PERCEPTION use_xp (see.c),
#   resting while hurt or with low mana -> REGENERATE (about once per second).
#   MINING, WOODCUTTING, FARMING (per resource), SMITHING and CRAFTING (per
#   thing made) get their XP from zones/generic/skilling.cfg.
#
# XP curve: level 2 needs xp_base XP, every further level needs xp_growth
# percent of the step before (80 / 110 -> level 99 needs about 9.1 million).
# rate= is the global XP multiplier in percent (use it for XP events).
# retire=V_X: value slot of a removed skill; players get 0 there at login
# (old attributes, Tactics, Surround Hit, Barter, Immunity, Body Control,
# Clarity). Enemies keep whatever their .chr files give them.

config:
xp_base=80
xp_growth=110
rate=75
retire=V_WIS
retire=V_INT
retire=V_AGI
retire=V_TACTICS
retire=V_SURROUND
retire=V_BARTER
retire=V_IMMUNITY
retire=V_BODYCONTROL
retire=V_CLARITY
;

# ---- powers ----
HP:
id=0
name="Hitpoints"
group=power
value=V_HP
start=25
max=99
description="Your health. Trained by dealing damage in combat."
;

ENDURANCE:
id=1
name="Endurance"
group=power
value=V_ENDURANCE
start=25
max=99
description="Stamina for running and fighting. Trained by fighting and warcry."
;

MANA:
id=2
name="Mana"
group=power
value=V_MANA
start=25
max=99
description="Magical energy. Trained by casting."
;

# ---- combat ----
ATTACK:
id=18
name="Attack"
group=combat
value=V_ATTACK
mirror=V_DAGGER
mirror=V_HAND
mirror=V_STAFF
mirror=V_SWORD
mirror=V_TWOHAND
start=1
max=99
dmg_xp=12
feed=HP,33
feed=ENDURANCE,10
feed=ATHLETICS,25
description="Melee hit chance. Needed to wield weapons, and raises the stats of the weapon you hold. Trained by melee damage with the Attack or Shared combat style (/style)."
;

STRENGTH:
id=6
name="Strength"
group=combat
value=V_STR
start=1
max=99
dmg_xp=12
feed=HP,33
feed=ENDURANCE,10
feed=ATHLETICS,25
description="Melee max hit. Trained by melee damage with the Strength or Shared combat style (/style)."
;

DEFENCE:
id=19
name="Defence"
group=combat
value=V_PARRY
mirror=V_ARMORSKILL
start=1
max=99
use_xp=2
dmg_xp=12
feed=HP,33
feed=ENDURANCE,10
feed=ATHLETICS,25
description="Avoids melee hits and resists spells. Needed to wear armour, and raises the stats of the armour you wear. Trained by melee damage with the Defence or Shared combat style (/style), and a little when attacks on you miss."
;

WARCRY:
id=20
name="Warcry"
group=combat
value=V_WARCRY
start=1
max=99
use_xp=12
dmg_xp=8
