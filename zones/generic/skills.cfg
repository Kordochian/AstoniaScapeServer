name="Athletics"
group=combat
value=V_SPEEDSKILL
start=1
max=99
description="Movement and attack speed. Trained by walking in fast or stealth mode, and gets a quarter of Attack, Defence, Warcry, Mining and Woodcutting XP."
;

SLAYER:
id=54
name="Slayer"
group=combat
start=1
max=99
description="Not set up yet."
;

# ---- magic ----
MAGIC:
id=32
name="Magic"
group=magic
value=V_FIRE
mirror=V_FLASH
mirror=V_FREEZE
mirror=V_HEAL
mirror=V_BLESS
mirror=V_MAGICSHIELD
start=1
max=99
