# =====================================================================
# quests.cfg - skill XP rewards for quests (Astonia rebuild)
# =====================================================================
#
# One block per quest. The block name is only a label.
#
#   quest=          quest number (the list at the end of this file)
#   xp=KEY,amount   skill XP the quest gives (KEY from skills.cfg, up to 8)
#
# Doing a repeatable quest again gives less: 82%, 68%, 56% ... down to 15%
# (questlog_scale in questlog.c). The global rate= in skills.cfg applies.
# Read when an area starts. A quest with no block here gives no XP.
# For scale (XP for one more level): skills starting at 1 need 80 for level 2
# and 88 more for level 3; powers like Hitpoints (start 25) need about 790
# for 26. /questxp <nr>
# (god) gives a quest's XP without doing it, for testing.


# Quest numbers (from questlog.c):
#     0  Lydia's Potion                   James (Cameron)
LYDIAS_POTION:
quest=0
# step 18 (one skill list): Wisdom + Intuition -> Magic, Agility -> Athletics,
# Dagger + Attack -> Attack, Parry -> Defence
xp=MAGIC,200
xp=ATHLETICS,100
xp=STRENGTH,100
xp=ATTACK,200
xp=DEFENCE,100

;
#     1  Find the Magic Item              Gwendylon (Cameron)
FIRST_SKULL:
quest=1
# step 18: Lightning + Fire -> Magic, Sword + Two-Handed -> Attack, Tactics -> Strength
xp=MAGIC,300
xp=ATTACK,300
xp=STRENGTH,150
